name: Build and Unit Tests
on: [push, pull_request]
permissions: {contents: read}

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: >-
          xcodebuild -project Clipper.xcodeproj -scheme Clipper -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test

  build-and-release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions: {contents: write}
    env:
      APP_PATH: build/Build/Products/Release/Clipper.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Check release signing configuration
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_CERTIFICATE_SHA1: ${{ vars.RELEASE_CERTIFICATE_SHA1 }}
        run: |
          : "${RELEASE_CERTIFICATE_BASE64:?Configure the persistent release certificate before publishing}"
          : "${RELEASE_CERTIFICATE_PASSWORD:?Configure the certificate password before publishing}"
          : "${RELEASE_CERTIFICATE_SHA1:?Configure the certificate fingerprint before publishing}"
      - name: Build Release app
        run: |
          xcodebuild -project Clipper.xcodeproj -scheme Clipper -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Sign with persistent release identity
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_CERTIFICATE_SHA1: ${{ vars.RELEASE_CERTIFICATE_SHA1 }}
        run: bash scripts/sign-release.sh
      - name: Package ZIP
        run: ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Clipper-macOS.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Contents/Info.plist").$GITHUB_RUN_NUMBER"
          gh release create "$VERSION" Clipper-macOS.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Clipper $VERSION" --generate-notes
